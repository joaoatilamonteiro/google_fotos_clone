<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria</title>
    <!-- NOVO: Importando a biblioteca do HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .grade-fotos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            padding: 10px;
        }
        .item-midia img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .item-midia img:hover {
            transform: scale(1.05);
            cursor: pointer;
        }
        .localizacao {
            font-size: 12px;
            color: #aaaaaa;
            margin-top: 5px;
            text-align: center;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Minhas Memórias</h1>

    <!-- Atualizamos a variável para pegar a contagem total do banco de dados -->
    <p style="text-align: center; color: #888;">
        Exibindo {{ total_midias }} fotos e vídeos
    </p>

    <div class="grade-fotos">

        <!-- Pede pro Django incluir o primeiro lote de fotos aqui dentro -->
        {% include 'galeria/lista_midias.html' %}

    </div>

</body>
</html>
